[project]
name = "mindofshaun-server"
version = "0.1.0"
description = "Chat API for mindofshaun.com"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.128",
    "pydantic-ai-slim[anthropic,openai,openrouter,ui]>=1.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
